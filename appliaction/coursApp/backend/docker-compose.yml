services:
  database:
    container_name: ${DATABASE_HOST}

    image: mysql:8.0
    restart: on-failure
    ports:
      - "${DATABASE_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USERNAME}

      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appliaction_app-network

  phpmyadmin:
    image: phpmyadmin:latest
    restart: on-failure
    ports:

      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    networks:
      - appliaction_app-network
    depends_on:
      - database

volumes:
  mysql_data:

networks:
  appliaction_app-network:
    external: true  # если сеть создается в другом файле
    driver: bridge